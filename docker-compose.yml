services:
  peito-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: peito-backend
    hostname: peito-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      SEED_FILE_PATH: ${SEED_FILE_PATH}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - peito_net
      - homelab_net

  peito-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peito-frontend
    hostname: peito-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      peito-backend:
        condition: service_healthy
    networks:
      - peito_net
      - homelab_net

networks:
  peito_net:
    driver: bridge
  homelab_net:
    external: true
