services:
  db:
    image: postgres:16-alpine
    container_name: peito-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peito_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peito_secret_lan}
      POSTGRES_DB: ${POSTGRES_DB:-peito_infinity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peito_user} -d ${POSTGRES_DB:-peito_infinity}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - peito_infinity_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: peito-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://peito_user:peito_secret_lan@db:5432/peito_infinity}
      SEED_FILE_PATH: ${SEED_FILE_PATH:-/app/specs/data/guia-exercicios-seed.md}
      LLM_PROVIDER: ${LLM_PROVIDER:-specialist_engine}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - peito_infinity_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peito-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - peito_infinity_net

volumes:
  postgres_data:
    name: peito_infinity_postgres_data

networks:
  peito_infinity_net:
    name: peito_infinity_net
    driver: bridge
